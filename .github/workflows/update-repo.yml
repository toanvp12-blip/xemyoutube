name: Update APT Repo Index
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build & patch tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd dpkg-dev
      - name: Build Rootful, Rootless & RootHide debs
        run: |
          cd public/debs2
          BASE_DEB=$(ls *.deb | head -n 1)
          if [ -z "$BASE_DEB" ]; then exit 1; fi

          mkdir -p base_extract
          dpkg-deb -R "$BASE_DEB" base_extract

          if [ -d "base_extract/var/jb" ]; then
            cp -rn base_extract/var/jb/* base_extract/ 2>/dev/null || true
            rm -rf base_extract/var/jb
          fi

          rm -f *.deb

          # 1. ROOTFUL (iphoneos-arm)
          mkdir -p pkg_rootful
          cp -a base_extract/* pkg_rootful/
          sed -i "s/^Architecture:.*/Architecture: iphoneos-arm/" pkg_rootful/DEBIAN/control
          sed -i "s/^Depends:.*/Depends: firmware (>= 15.0)/" pkg_rootful/DEBIAN/control
          dpkg-deb -b pkg_rootful "com.xemyoutube_2.1.3_iphoneos-arm.deb"

          # 2. ROOTLESS (iphoneos-arm64)
          mkdir -p pkg_rootless/var/jb
          cp -a base_extract/DEBIAN pkg_rootless/
          for dir in base_extract/*; do
            base=$(basename "$dir")
            if [ "$base" != "DEBIAN" ]; then
              cp -a "$dir" pkg_rootless/var/jb/
            fi
          done
          sed -i "s/^Architecture:.*/Architecture: iphoneos-arm64/" pkg_rootless/DEBIAN/control
          sed -i "s/^Depends:.*/Depends: firmware (>= 15.0)/" pkg_rootless/DEBIAN/control
          for script in postinst prerm postrm preinst; do
            if [ -f "pkg_rootless/DEBIAN/$script" ]; then
              sed -i 's| /Applications| /var/jb/Applications|g; s| /Library| /var/jb/Library|g; s| /usr| /var/jb/usr|g' "pkg_rootless/DEBIAN/$script"
              chmod 0755 "pkg_rootless/DEBIAN/$script"
            fi
          done
          dpkg-deb -b pkg_rootless "com.xemyoutube_2.1.3_iphoneos-arm64.deb"

          # 3. ROOTHIDE (iphoneos-arm64e)
          mkdir -p pkg_roothide
          cp -a pkg_rootless/* pkg_roothide/
          sed -i "s/^Architecture:.*/Architecture: iphoneos-arm64e/" pkg_roothide/DEBIAN/control
          sed -i "s/^Depends:.*/Depends: firmware (>= 15.0)/" pkg_roothide/DEBIAN/control
          dpkg-deb -b pkg_roothide "com.xemyoutube_2.1.3_iphoneos-arm64e.deb"

          rm -rf base_extract pkg_rootful pkg_rootless pkg_roothide

          cd ..
          dpkg-scanpackages -m debs2 > Packages
          gzip -9c Packages > Packages.gz
          zstd -19 -f Packages -o Packages.zst
          cat <<EOF > Release
          Origin: XemYouTube
          Label: XemYouTube
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho luu tru XemYouTube CarPlay
          MD5Sum:
           $(md5sum Packages | cut -d' ' -f1) $(wc -c < Packages) Packages
           $(md5sum Packages.gz | cut -d' ' -f1) $(wc -c < Packages.gz) Packages.gz
           $(md5sum Packages.zst | cut -d' ' -f1) $(wc -c < Packages.zst) Packages.zst
          SHA256:
           $(sha256sum Packages | cut -d' ' -f1) $(wc -c < Packages) Packages
           $(sha256sum Packages.gz | cut -d' ' -f1) $(wc -c < Packages.gz) Packages.gz
           $(sha256sum Packages.zst | cut -d' ' -f1) $(wc -c < Packages.zst) Packages.zst
          EOF
      - name: Commit & Push updated repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/
          git diff --staged --quiet || (git commit -m "simplify Depends for universal compatibility" && git push)