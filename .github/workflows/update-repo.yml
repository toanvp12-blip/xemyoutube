name: Update APT Repo Index
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zstd dpkg-dev
      - name: Fix deb internal architecture & Build APT Index
        run: |
          cd public/debs2
          for f in *.deb; do
            if [[ "$f" == *"arm64e.deb" ]]; then target_arch="iphoneos-arm64e";
            elif [[ "$f" == *"arm64.deb" ]]; then target_arch="iphoneos-arm64";
            else target_arch="iphoneos-arm"; fi

            mkdir -p tmp_deb
            dpkg-deb -R "$f" tmp_deb
            sed -i "s/^Architecture:.*/Architecture: $target_arch/" tmp_deb/DEBIAN/control
            dpkg-deb -b tmp_deb "$f"
            rm -rf tmp_deb
          done
          cd ..
          dpkg-scanpackages -m debs2 > Packages
          gzip -9c Packages > Packages.gz
          zstd -19 -f Packages -o Packages.zst
          cat <<EOF > Release
          Origin: XemYouTube
          Label: XemYouTube
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho luu tru XemYouTube CarPlay
          MD5Sum:
           $(md5sum Packages | cut -d' ' -f1) $(wc -c < Packages) Packages
           $(md5sum Packages.gz | cut -d' ' -f1) $(wc -c < Packages.gz) Packages.gz
           $(md5sum Packages.zst | cut -d' ' -f1) $(wc -c < Packages.zst) Packages.zst
          SHA256:
           $(sha256sum Packages | cut -d' ' -f1) $(wc -c < Packages) Packages
           $(sha256sum Packages.gz | cut -d' ' -f1) $(wc -c < Packages.gz) Packages.gz
           $(sha256sum Packages.zst | cut -d' ' -f1) $(wc -c < Packages.zst) Packages.zst
          EOF
      - name: Commit & Push updated debs and index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/debs2/*.deb public/Packages public/Packages.gz public/Packages.zst public/Release
          git diff --staged --quiet || (git commit -m "fix internal deb architecture to arm64" && git push)