name: Build & Update APT Repo
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/update-repo.yml"
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos, Swift & iOS SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential fakeroot unzip zstd dpkg-dev clang libncurses5

          SWIFT_URL="https://download.swift.org/swift-5.10.1-release/ubuntu2404/swift-5.10.1-RELEASE/swift-5.10.1-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL "$SWIFT_URL" -o swift.tar.gz
          sudo tar -xzf swift.tar.gz -C /usr/local --strip-components=1
          rm -f swift.tar.gz

          export THEOS=/opt/theos
          sudo git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          curl -fsSL "https://github.com/theos/sdks/archive/master.zip" -o sdks.zip
          unzip -q sdks.zip
          sudo mv sdks-master/*.sdk $THEOS/sdks/
          rm -rf sdks.zip sdks-master

          sudo curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Compile Rootful, Rootless & RootHide debs
        env:
          THEOS: /opt/theos
        run: |
          cd src
          chmod +x layout/DEBIAN/postinst
          mkdir -p ../public/debs2

          make clean && make package FINALPACKAGE=1
          cp packages/*.deb ../public/debs2/com.xemyoutube_2.1.3_iphoneos-arm.deb

          make clean && THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          cp packages/*.deb ../public/debs2/com.xemyoutube_2.1.3_iphoneos-arm64.deb
          cp packages/*.deb ../public/debs2/com.xemyoutube_2.1.3_iphoneos-arm64e.deb

      - name: Fix RootHide Architecture & Build APT Index
        run: |
          cd public/debs2
          mkdir -p tmp_rh
          dpkg-deb -R com.xemyoutube_2.1.3_iphoneos-arm64e.deb tmp_rh
          sed -i 's/^Architecture.*/Architecture\x3a iphoneos-arm64e/' tmp_rh/DEBIAN/control
          dpkg-deb -b tmp_rh com.xemyoutube_2.1.3_iphoneos-arm64e.deb
          rm -rf tmp_rh

          cd ..
          dpkg-scanpackages -m debs2 > Packages
          gzip -9c Packages > Packages.gz
          zstd -19 -f Packages -o Packages.zst

          printf "Origin\x3a XemYouTube\n" > Release
          printf "Label
$wfFile = "$PWD\.github\workflows\update-repo.yml"
$buildYml = @'
name: Build & Update APT Repo
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/update-repo.yml"
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos, Swift & iOS SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential fakeroot unzip zstd dpkg-dev clang libncurses5

          SWIFT_URL="https://download.swift.org/swift-5.10.1-release/ubuntu2404/swift-5.10.1-RELEASE/swift-5.10.1-RELEASE-ubuntu24.04.tar.gz"
          curl -fsSL "$SWIFT_URL" -o swift.tar.gz
          sudo tar -xzf swift.tar.gz -C /usr/local --strip-components=1
          rm -f swift.tar.gz

          export THEOS=/opt/theos
          sudo git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS
          curl -fsSL "https://github.com/theos/sdks/archive/master.zip" -o sdks.zip
          unzip -q sdks.zip
          sudo mv sdks-master/*.sdk $THEOS/sdks/
          rm -rf sdks.zip sdks-master

          sudo curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Compile Rootful, Rootless & RootHide debs
        env:
          THEOS: /opt/theos
        run: |
          cd src
          chmod +x layout/DEBIAN/postinst
          mkdir -p ../public/debs2

          make clean && make package FINALPACKAGE=1
          cp packages/*.deb ../public/debs2/com.xemyoutube_2.1.3_iphoneos-arm.deb

          make clean && THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          cp packages/*.deb ../public/debs2/com.xemyoutube_2.1.3_iphoneos-arm64.deb
          cp packages/*.deb ../public/debs2/com.xemyoutube_2.1.3_iphoneos-arm64e.deb

      - name: Fix RootHide Architecture & Build APT Index
        run: |
          cd public/debs2
          mkdir -p tmp_rh
          dpkg-deb -R com.xemyoutube_2.1.3_iphoneos-arm64e.deb tmp_rh
          sed -i 's/^Architecture.*/Architecture\x3a iphoneos-arm64e/' tmp_rh/DEBIAN/control
          dpkg-deb -b tmp_rh com.xemyoutube_2.1.3_iphoneos-arm64e.deb
          rm -rf tmp_rh

          cd ..
          dpkg-scanpackages -m debs2 > Packages
          gzip -9c Packages > Packages.gz
          zstd -19 -f Packages -o Packages.zst

          printf "Origin\x3a XemYouTube\n" > Release
          printf "Label\x3a XemYouTube\n" >> Release
          printf "Suite\x3a stable\n" >> Release
          printf "Version\x3a 1.0\n" >> Release
          printf "Codename\x3a ios\n" >> Release
          printf "Architectures\x3a iphoneos-arm iphoneos-arm64 iphoneos-arm64e\n" >> Release
          printf "Components\x3a main\n" >> Release
          printf "Description\x3a Kho luu tru XemYouTube CarPlay\n" >> Release
          printf "MD5Sum\x3a\n" >> Release
          printf " %s %s Packages\n" "$(md5sum Packages | cut -d' ' -f1)" "$(wc -c < Packages)" >> Release
          printf " %s %s Packages.gz\n" "$(md5sum Packages.gz | cut -d' ' -f1)" "$(wc -c < Packages.gz)" >> Release
          printf " %s %s Packages.zst\n" "$(md5sum Packages.zst | cut -d' ' -f1)" "$(wc -c < Packages.zst)" >> Release
          printf "SHA256\x3a\n" >> Release
          printf " %s %s Packages\n" "$(sha256sum Packages | cut -d' ' -f1)" "$(wc -c < Packages)" >> Release
          printf " %s %s Packages.gz\n" "$(sha256sum Packages.gz | awk '{print $1}')" "$(wc -c < Packages.gz)" >> Release
          printf " %s %s Packages.zst\n" "$(sha256sum Packages.zst | awk '{print $1}')" "$(wc -c < Packages.zst)" >> Release

      - name: Commit & Push compiled debs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/
          git diff --staged --quiet || (git commit -m "build XemYouTube 2.1.3 from source" && git push)