name: Build APT Repository

on:
  push:
    branches: [ main ]
    paths:
      - 'public/debs2/**'
      - '.github/workflows/build-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dpkg-dev, bzip2 & zstd
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev bzip2 gzip zstd

      - name: Build Packages Index & Release
        working-directory: ./public
        run: |
          mkdir -p debs2
          dpkg-scanpackages -m debs2 /dev/null > Packages
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          zstd -q -c19 Packages > Packages.zst

          cat << 'EOF' > Release
          Origin: XemYouTube
          Label: XemYouTube
          Suite: stable
          Version: 1.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Kho luu tru chinh thuc cua XemYouTube Tweak
          EOF

      - name: Commit & Push updated Packages index
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add public/Packages public/Packages.gz public/Packages.bz2 public/Packages.zst public/Release
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: add Packages.zst and Release for Sileo" && git push)